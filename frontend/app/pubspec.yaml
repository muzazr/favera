name: app
description: "Favera Frontend Mobile Application"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Core State Management & Navigation
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.0

  # Networking & Serialization
  dio: ^5.7.0
  json_annotation: ^4.9.0

  # Platform & File Utilities
  file_picker: ^8.1.7
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.3.5

  # UI Utilities
  intl: ^0.20.2
  flutter_svg: ^2.0.17
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  build_runner: ^2.4.14
  json_serializable: ^6.9.4
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/

